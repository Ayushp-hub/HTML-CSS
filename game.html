<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Only Game</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #1d2671, #c33764);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

.game {
    position: relative;
    width: 400px;
    height: 400px;
    border: 4px solid white;
    overflow: hidden;
}

/* Hide checkbox */
input {
    display: none;
}

/* Moving box */
label {
    width: 50px;
    height: 50px;
    background: yellow;
    position: absolute;
    cursor: pointer;
    animation: move 10s infinite linear;
}

/* Score display */
.score {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 18px;
}

/* Increase score when clicked */
input:checked + label {
    background: lime;
}

/* Movement animation */
@keyframes move {
    0%   { top: 0; left: 0; }
    25%  { top: 0; left: 350px; }
    50%  { top: 350px; left: 350px; }
    75%  { top: 350px; left: 0; }
    100% { top: 0; left: 0; }
}
</style>
</head>

<body>

<div class="game">
    <div class="score">Click the Box!</div>

    <input type="checkbox" id="box">
    <label for="box"></label>
</div>

</body>
</html>
